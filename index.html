
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emilio AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #080d19;
  color: white;
}

header {
  padding: 22px;
  text-align: center;
  border-bottom: 1px solid #202b40;
}

.logo {
  font-size: 28px;
  font-weight: bold;
  color: #63a9ff;
}

header p {
  color: #91a2bb;
  font-size: 13px;
}

main {
  max-width: 650px;
  margin: auto;
  padding: 20px;
}

.welcome {
  text-align: center;
  margin: 55px 0 35px;
}

.brain {
  font-size: 55px;
}

h1 {
  color: #68aaff;
}

.welcome p {
  color: #aab6ca;
}

#chat {
  min-height: 180px;
  padding-bottom: 20px;
}

.message {
  padding: 14px;
  border-radius: 14px;
  margin: 12px 0;
  line-height: 1.5;
  background: #18243a;
  overflow-wrap: anywhere;
}

.user {
  background: #164d85;
  margin-left: 35px;
}

.bot {
  margin-right: 20px;
}

.input-area {
  display: flex;
  gap: 8px;
  position: sticky;
  bottom: 0;
  background: #080d19;
  padding: 12px 0;
}

input {
  flex: 1;
  min-width: 0;
  padding: 15px;
  border-radius: 12px;
  border: 1px solid #35445d;
  background: #131d30;
  color: white;
  outline: none;
}

button {
  border: none;
  border-radius: 12px;
  padding: 14px;
  background: #2879db;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

footer {
  text-align: center;
  padding: 20px;
  color: #71829c;
  font-size: 12px;
}
</style>
</head>

<body>

<header>
  <div class="logo">✦ EMILIO AI</div>
  <p>Tu inteligencia artificial personal</p>
</header>

<main>

  <section class="welcome">
    <div class="brain">🤖</div>
    <h1>Hola, soy Emilio AI</h1>
    <p>¿En qué puedo ayudarte hoy?</p>
  </section>

  <div id="chat"></div>

  <div class="input-area">
    <input
      id="question"
      placeholder="Escribe tu pregunta..."
      onkeydown="if(event.key==='Enter')sendMessage()"
    >
    <button onclick="sendMessage()">Enviar</button>
  </div>

</main>

<footer>
  Emilio AI © 2026 · Creado por Emilio
</footer>

<script>
function sendMessage() {
  const input = document.getElementById("question");
  const chat = document.getElementById("chat");
  const question = input.value.trim();

  if (!question) return;

  const userMessage = document.createElement("div");
  userMessage.className = "message user";
  userMessage.textContent = question;
  chat.appendChild(userMessage);

  const answer = document.createElement("div");
  answer.className = "message bot";

  let response = "¡Hola! Soy Emilio AI. Esta es mi primera versión. Pronto tendré inteligencia artificial real.";

  if (question.toLowerCase().includes("hola")) {
    response = "¡Hola! 👋 Soy Emilio AI. ¿Cómo puedo ayudarte?";
  } else if (question.toLowerCase().includes("programar")) {
    response = "¡Me encanta la programación! Podemos aprender HTML, CSS y JavaScript juntos.";
  } else if (question.toLowerCase().includes("web")) {
    response = "Podemos construir páginas web modernas usando HTML, CSS y JavaScript.";
  } else if (question.toLowerCase().includes("imagen")) {
    response = "¡Podemos trabajar en ideas para crear imágenes y diseños!";
  }

  answer.textContent = response;
  chat.appendChild(answer);

  input.value = "";
  chat.scrollIntoView({ behavior: "smooth", block: "end" });
}
</script>

</body>
</html>
